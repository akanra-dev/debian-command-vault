<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debian Command Vault — Searchable Linux Commands Reference</title>
    <meta name="description" content="Debian Command Vault: a searchable vault of 150+ Linux/Debian commands (grep, find, tar, chmod, systemctl, journalctl). Built with Go, SQLite, and Docker.">
    <meta name="keywords" content="debian commands, linux commands, terminal, bash, grep, systemctl, go, sqlite, docker, command reference">
    <meta name="author" content="akanra-dev">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://debian-command-vault.onrender.com/">

    <!-- Open Graph (social media preview) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Debian Command Vault 🐧">
    <meta property="og:description" content="Searchable vault of 150+ Linux/Debian commands. Go + SQLite + Docker.">
    <meta property="og:url" content="https://debian-command-vault.onrender.com/">
    <meta property="og:image" content="https://raw.githubusercontent.com/akanra-dev/debian-command-vault/main/vault.jpg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Debian Command Vault 🐧">
    <meta name="twitter:description" content="Searchable vault of 150+ Linux/Debian commands. Go + SQLite + Docker.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/akanra-dev/debian-command-vault/main/vault.jpg">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>">

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Debian Command Vault",
      "url": "https://debian-command-vault.onrender.com/",
      "description": "A searchable vault of useful Linux and Debian commands.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "author": { "@type": "Person", "name": "akanra-dev", "url": "https://github.com/akanra-dev" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="header-glow"></div>
    <div class="header-content">
        <div class="brand">
            <div class="brand-logo">🐧</div>
            <div>
                <h1>Debian Command Vault</h1>
                <p class="tagline">Store and search useful Debian Commands</p>
            </div>
        </div>
        <button id="theme-toggle" class="theme-toggle">
            <span class="theme-icon">🌙</span>
            <span class="theme-label">Dark</span>
        </button>
    </div>
</header>

<main class="main-content">
    <div id="counter" class="counter"></div>

    <div class="toolbar">
        <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input
                id="search"
                type="text"
                placeholder="Search commands, flags, keywords..."
            >
            <span class="search-shortcut">/</span>
        </div>

        <div class="toolbar-actions">
            <select id="category-filter" class="select-control">
                <option value="all">All Categories</option>
            </select>

            <button id="show-add-form" class="btn btn-primary">
                <span class="btn-plus">+</span> Add Command
            </button>
        </div>
    </div>

    <div id="add-form" class="add-form hidden">
        <div class="form-head">
            <h3>Add New Command</h3>
            <button id="cancel-add" class="form-close" aria-label="Close">×</button>
        </div>
        <div class="form-grid">
            <div class="form-field">
                <label for="add-name">Name</label>
                <input id="add-name" type="text" placeholder="e.g. Check Disk Usage">
            </div>
            <div class="form-field">
                <label for="add-command">Command</label>
                <input id="add-command" type="text" placeholder="e.g. df -h" class="mono-input">
            </div>
            <div class="form-field">
                <label for="add-desc">Description</label>
                <input id="add-desc" type="text" placeholder="What does it do?">
            </div>
            <div class="form-field">
                <label for="add-category">Category</label>
                <select id="add-category" class="select-control"></select>
                <input id="add-new-category" type="text" placeholder="Or type a new category..." class="new-cat-input">
            </div>
        </div>
        <div class="form-actions">
            <button id="save-command" class="btn btn-success">Save Command</button>
        </div>
    </div>

    <div id="commands" class="commands-grid"></div>
</main>

<footer class="site-footer">
    <p>Built with 🐧 on Debian — <span class="footer-highlight">Go + SQLite + Docker</span></p>
</footer>

<script src="app.js"></script>

</body>
</html>
